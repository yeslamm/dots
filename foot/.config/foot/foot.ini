[main]
shell=/bin/zsh
term=foot
login-shell=no
app-id=foot
title=foot
locked-title=no

font=JetBrainsMono NF:size=14:antialias=true:autohint=true
font-bold=JetBrainsMono NF:style=Bold:size=14
font-italic=JetBrainsMono NF:style=Italic:size=14
font-bold-italic=JetBrainsMono NF:style=Bold Italic:size=14

letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
underline-offset=2px
underline-thickness=1px
box-drawings-uses-font-glyphs=no
gamma-correct-blending=yes

initial-window-size-pixels=1100x800
initial-window-mode=windowed
pad=2x2 center
resize-by-cells=no
resize-keep-grid=no
resize-delay-ms=0

workers=4
bold-text-in-bright=palette-based
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary

[scrollback]
lines=5000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=block
unfocused-style=hollow
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
style=single

[security]
osc52=enabled

[bell]
system=no
urgent=yes
visual=no

[colors-dark]
background=161616
foreground=f2f4f8

selection-background=2a2a2a
selection-foreground=78a9ff
urls=08bdba
flash=ee5396
flash-alpha=0.2

search-box-match=282828 08bdba
search-box-no-match=282828 ee5396

regular0=282828
regular1=ee5396
regular2=25be6a
regular3=08bdba
regular4=78a9ff
regular5=be95ff
regular6=33b1ff
regular7=dfdfe0

bright0=484848
bright1=f16da6
bright2=46ca80
bright3=2cc7c5
bright4=8cb6ff
bright5=c8a5ff
bright6=52bdff
bright7=e4e4e5

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert

search-start=Control+Shift+r
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+y

scrollback-up-page=Control+Shift+Page_Up Control+Shift+u
scrollback-down-page=Control+Shift+Page_Down Control+Shift+d
scrollback-up-line=Control+Shift+Up Control+Shift+k
scrollback-down-line=Control+Shift+Down Control+Shift+j
scrollback-home=Control+Shift+Home Control+Shift+h
scrollback-end=Control+Shift+End Control+Shift+l

unicode-input=none

font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[tweak]
overflowing-glyphs=yes
delayed-render-lower=500000
delayed-render-upper=8333333
grapheme-shaping=yes
grapheme-width-method=double-width
pre-apply-damage=yes
max-shm-pool-size-mb=2048
surface-bit-depth=8-bit
