# -*- conf -*-
# ~/.config/foot/foot.ini
# Immaculate Carbonfox Tiling Configuration

# --------------------------------------------------------------------------
# 1. MAIN ENGINE CONFIGURATION
# --------------------------------------------------------------------------
[main]
shell=/bin/zsh
term=foot
login-shell=no
app-id=foot
title=foot
locked-title=no

# Font Engine Calibration
font=JetBrainsMono NF:size=16:antialias=true:autohint=true
font-bold=JetBrainsMono NF:style=Bold:size=16
font-italic=JetBrainsMono NF:style=Italic:size=16
font-bold-italic=JetBrainsMono NF:style=Bold Italic:size=16

letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
underline-offset=2px
underline-thickness=1px

box-drawings-uses-font-glyphs=no

initial-window-size-pixels=1100x800

# Tiling Window Manager Geometry Controls
pad=0x0 center
resize-by-cells=yes
resize-keep-grid=no
resize-delay-ms=0

# Performance Profiles
# Matches rendering thread loops dynamically to your hardware composition
workers=0 
bold-text-in-bright=palette-based
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary

# --------------------------------------------------------------------------
# 2. SCROLLBACK & VIEWPORT MANAGEMENT
# --------------------------------------------------------------------------
[scrollback]
lines=5000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

# --------------------------------------------------------------------------
# 3. INTERACTIVE CURSOR & MOUSE CONTEXT
# --------------------------------------------------------------------------
[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=no
alternate-scroll-mode=yes

# --------------------------------------------------------------------------
# 4. KEYBOARD INTERACTIVES (URL OVERLAYS & SEARCH)
# --------------------------------------------------------------------------
[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
style=single

[security]
osc52=enabled

[bell]
system=no
urgent=yes
visual=no

# --------------------------------------------------------------------------
# 5. THE EMULATOR PALETTE: PURE CARBONFOX
# --------------------------------------------------------------------------
[colors-dark]
background=161616
foreground=f2f4f8

# Selection overlays & UX elements
selection-background=2a2a2a
selection-foreground=78a9ff
urls=08bdba
flash=ee5396
flash-alpha=0.2

# Search box matches
search-box-match=282828 08bdba
search-box-no-match=282828 ee5396

## Base ANSI Color Blocks
regular0=282828
regular1=ee5396
regular2=25be6a
regular3=08bdba
regular4=78a9ff
regular5=be95ff
regular6=33b1ff
regular7=dfdfe0

## High-Intensity Bright Accent Blocks
bright0=484848
bright1=f16da6
bright2=46ca80
bright3=2cc7c5
bright4=8cb6ff
bright5=c8a5ff
bright6=52bdff
bright7=e4e4e5

# --------------------------------------------------------------------------
# 6. HIGH-SPEED UX KEYBOARD SHORTCUTS
# --------------------------------------------------------------------------
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert

# Built-in High-Contrast Search & URL Engines
search-start=Control+Shift+r
show-urls-launch=Control+Shift+o

# Viewport Navigation Controls
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-home=Shift+Home
scrollback-end=Shift+End

# Font scale adjustments
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

# --------------------------------------------------------------------------
# 7. LOW-LEVEL GRAPHICS PERFORMANCE PIPELINES
# --------------------------------------------------------------------------
[tweak]
overflowing-glyphs=yes
delayed-render-lower=500000
delayed-render-upper=8333333
grapheme-shaping=yes
grapheme-width-method=double-width
pre-apply-damage=yes
max-shm-pool-size-mb=2048
