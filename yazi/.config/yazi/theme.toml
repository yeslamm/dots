# A Fuzzel-Matched Theme for Yazi
# Fixed: Symlink contrast adapts to selection (Dark on Blue / White on Dark)

"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

# : Flavor {{{
[flavor]
dark = ""
light = ""
# : }}}

# : App {{{
[app]
overall = {}
# : }}}

# : Manager {{{
[mgr]
cwd = { fg = "blue" }

# Find / Search Highlight
# Changed from Red (#e06c75) to Purple (#c678dd) for a smoother look
find_keyword = { fg = "magenta", bold = true, italic = true, underline = true }
find_position = { fg = "blue", bg = "reset", bold = true, italic = true }

# OneDark Comment Grey for a darker, more integrated look
symlink_target = { fg = "black", italic = true }

# Marker
marker_copied = { fg = "green", bg = "green" }
marker_cut = { fg = "red", bg = "red" }
marker_marked = { fg = "blue", bg = "blue" }
marker_selected = { fg = "blue", bg = "blue" }

# Count
count_copied = { fg = "black", bg = "green" }
count_cut = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "blue" }

# Border
border_symbol = "│"
border_style = { fg = "white" }

# Highlighting
syntect_theme = ""
# : }}}

# : Tabs {{{
[tabs]
# Active: Black on Cyan 
active = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "reset", bg = "black" }

# Boxxy Separators
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }
# : }}}

# : Mode {{{
[mode]
# Normal Mode: Cyan 
normal_main = { fg = "black", bg = "blue", bold = true }
normal_alt = { fg = "blue", bg = "black" }

# Select Mode: Purple
select_main = { fg = "black", bg = "magenta", bold = true }
select_alt = { fg = "magenta", bg = "black" }

# Unset Mode: Red
unset_main = { fg = "black", bg = "red", bold = true }
unset_alt = { fg = "red", bg = "black" }
# : }}}

# : Indicator of hovered file {{{
[indicator]
# Selection Bar: Directory Blue Background (#61afef) with Dark Text (#282928)
current = { bg = "blue", fg = "black", bold = true }
parent = { bg = "blue", fg = "black", bold = true }

# Boxxy Style: Solid vertical bar
padding = { open = "█", close = "" }
# : }}}

# : Status bar {{{
[status]
overall = {}
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "white" }
perm_type = { fg = "blue" }
perm_read = { fg = "green" }
perm_write = { fg = "red" }
perm_exec = { fg = "blue" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "black", bg = "blue" }
progress_error = { fg = "black", bg = "red" }
# : }}}

# : Which {{{
[which]
cols = 3
mask = { bg = "black" }
cand = { fg = "blue" }
rest = { fg = "white" }
desc = { fg = "magenta" }
separator = "  "
separator_style = { fg = "white" }
# : }}}

# : Confirmation {{{
[confirm]
border = { fg = "blue" }
title = { fg = "blue" }
body = { fg = "reset" }
list = {}
btn_yes = { reversed = true }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]
# : }}}

# : Spotter {{{
[spot]
border = { fg = "blue" }
title = { fg = "blue" }
tbl_col = { fg = "blue" }
tbl_cell = { fg = "black", bg = "blue" }
# : }}}

# : Notification {{{
[notify]
title_info = { fg = "green" }
title_warn = { fg = "yellow" }
title_error = { fg = "red" }

icon_info = ""
icon_warn = ""
icon_error = ""
# : }}}

# : Picker {{{
[pick]
border = { fg = "blue" }
active = { fg = "blue", bold = true }
inactive = { fg = "reset" }
# : }}}

# : Input {{{
[input]
border = { fg = "blue" }
title = { fg = "reset" }
value = { fg = "reset" }
selected = { reversed = true }
# : }}}

# : Completion {{{
[cmp]
border = { fg = "blue" }
active = { fg = "black", bg = "blue" }
inactive = { fg = "reset" }

icon_file = ""
icon_folder = ""
icon_command = ""
# : }}}

# : Task manager {{{
[tasks]
border = { fg = "blue" }
title = { fg = "reset" }
hovered = { fg = "blue", bold = true }
# : }}}

# : Help menu {{{
[help]
on = { fg = "blue" }
run = { fg = "magenta" }
desc = { fg = "reset" }
hovered = { reversed = true, bold = true }
footer = { fg = "black", bg = "reset" }
# : }}}

# : File-specific styles {{{
[filetype]
rules = [
  # Directories -> Fuzzel Cyan/Blue
  { mime = "inode/directory", fg = "blue" },

  # Image
  { mime = "image/*", fg = "yellow" },
  # Media
  { mime = "{audio,video}/*", fg = "magenta" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "cyan" },
  # Fallback
  { url = "*/", fg = "reset" },
]
# : }}}

# : Icons {{{
[icon]
