[mgr]
scrolloff = 200
show_hidden = false
show_symlink = true

[preview]
image_provider = "sixel"
sixel_fraction = 15
max_width = 1920
max_height = 1200
wrap = "yes"
image_filter = "lanczos3"

[opener]
edit = [{ run = 'nvim "$@"', block = true, desc = "Edit" }]

[plugin]
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { mime = "audio/*", run = "mediainfo" },
  { mime = "video/*", run = "mediainfo" },
]
