[main]
font=JetBrainsMono Nerd Font:size=9
dpi-aware=auto
icon-theme=Papirus-Dark
fields=name,generic,comment,categories,filename,keywords
terminal=kitty -e {cmd}
width=44
horizontal-pad=20
vertical-pad=20
line-height=14
inner-pad=5
lines=12

[border]
width=2
radius=0

[colors]
background=232527ff
text=ffffffff
input=ffffffff
prompt=ffffffff
placeholder=8a8f93ff
border=8b939cff

match=3995e5ff

selection=2e3033ff
selection-text=ffffffff
selection-match=3995e5ff

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
delete-line-forward=none
delete-line-backward=none
delete-next=none
delete-prev=BackSpace
cancel=Escape Control+c
prev=Up Control+p Control+k
next=Down Control+n Control+j
first=Control+Home Control+h
last=Control+End Control+l
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
