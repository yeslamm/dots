[main]
font=JetBrainsMono Nerd Font:pixelsize=20
dpi-aware=no
icons-enabled=no
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e {cmd}
width=44
horizontal-pad=20
vertical-pad=20
line-height=22
inner-pad=10
lines=12
tabs=6

[border]
width=1
radius=0

[colors]
background=161616ff
text=dfdfe0ff
input=ffffffff
prompt=78a9ffff
placeholder=6f6f6fff
border=78a9ffff
match=78a9ffff
selection=262626ff
selection-text=78a9ffff
selection-match=78a9ffff

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
delete-line-forward=none
delete-line-backward=none
delete-next=none
delete-prev=BackSpace
cancel=Escape Control+c
prev=Up Control+p Control+k
next=Down Control+n Control+j
first=Control+Home Control+h
last=Control+End Control+l
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
