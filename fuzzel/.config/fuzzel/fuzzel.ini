# ~/.config/fuzzel/fuzzel.ini

[main]
font=Iosevka Nerd Font:size=9
dpi-aware=auto
icon-theme=Papirus-Dark
letter-spacing=1
fields=name,generic,comment,categories,filename,keywords
terminal=$TERMINAL -e 
width=44
horizontal-pad=10
vertical-pad=10
line-height=14
inner-pad=6
lines=12

[border]
width=2
radius=0

[colors]
background=282928ff
text=eceff4ff
input=ffffffff
prompt=ffffffff
placeholder=8b8f93ff
border=d3d7cfff
match=00afffff

selection=525459ff

selection-text=ffffffff

selection-match=00afffff

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
delete-line-forward=none

prev=Up Control+p Control+k
next=Down Control+n Control+j
