# ====================================================================
# SYSTEM & ENVIRONMENT
# ====================================================================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "foot"
set -ag terminal-overrides ",foot:Tc,image"

# Yazi passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Performance & Behavior
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g display-time 4000
setw -g aggressive-resize on
set-option -g status-keys emacs

# ====================================================================
# CORE OPTIONS
# ====================================================================
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ====================================================================
# GLOBAL SHORTCUTS (LEADERLESS)
# ====================================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --------------------------------------------------------------------
# Navigation & Layout
# --------------------------------------------------------------------
# Smart-splits focus navigation
bind-key -n 'C-h' if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Directional pane swaps
bind-key -n M-H swap-pane -d -t '{left-of}'
bind-key -n M-J swap-pane -d -t '{down-of}'
bind-key -n M-K swap-pane -d -t '{up-of}'
bind-key -n M-L swap-pane -d -t '{right-of}'

# Rotational pane swaps
bind-key -n M-R rotate-window -D
bind-key -n C-M-r rotate-window
bind-key -n M-Space next-layout

# Smart-splits pane resizing
bind-key -n C-M-h if -F "#{@pane-is-vim}" 'send-keys C-M-h' 'resize-pane -L 5'
bind-key -n C-M-j if -F "#{@pane-is-vim}" 'send-keys C-M-j' 'resize-pane -D 5'
bind-key -n C-M-k if -F "#{@pane-is-vim}" 'send-keys C-M-k' 'resize-pane -U 5'
bind-key -n C-M-l if -F "#{@pane-is-vim}" 'send-keys C-M-l' 'resize-pane -R 5'

# --------------------------------------------------------------------
# Window Tabs Management
# --------------------------------------------------------------------
# Clear out old bracket tab bindings
unbind -n M-[
unbind -n M-]
unbind -n M-p
unbind -n M-n
unbind -n C-M-p
unbind -n C-M-n

# Tab Reordering
bind H swap-window -t -1 \; previous-window
bind L swap-window -t +1 \; next-window

# Tab direct jumps
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Sway-Style Pane Allocation (Alt + Shift + 1-9)
bind -n M-! move-pane -t :1
bind -n M-@ move-pane -t :2
bind -n M-# move-pane -t :3
bind -n M-$ move-pane -t :4
bind -n M-% move-pane -t :5
bind -n M-^ move-pane -t :6
bind -n M-& move-pane -t :7
bind -n M-* move-pane -t :8
bind -n M-( move-pane -t :9

# ====================================================================
# PREFIX SHORTCUTS (CTRL + SPACE)
# ====================================================================
unbind l
bind l send-keys 'C-l'
bind v copy-mode

unbind ,
unbind $
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

bind C-b source-file $HOME/.config/tmux/tmux.conf \; display "Config reloaded!"

# --------------------------------------------------------------------
# Lifecycle & Splits
# --------------------------------------------------------------------
bind x kill-pane
bind X kill-window
bind C new-window -c "#{pane_current_path}"

# Standard splits
bind ';' split-window -v
bind "'" split-window -h

# Path-preserving splits
bind Enter split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# ====================================================================
# COPY MODE (VI STYLE)
# ====================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
# ====================================================================
# THEME: CARBONFOX CENTERED STATUS LINE (TEXT-ONLY)
# ====================================================================
set -g status "on"

set-option -g status-position top
set -g status-bg "#161616"
set -g status-fg "#f2f4f8"

# Center the window tabs perfectly
set -g status-justify absolute-centre

# --------------------------------------------------------------------
# Left & Right Visual Anchors
# --------------------------------------------------------------------
# Left: Clock Fail-Safe + Fixed Mode Indicator (No nested commas)
set -g status-left-length 50
set -g status-left " #[fg=#be95ff,bold]%H:%M #[fg=#262626]│ #{?client_prefix,#[fg=#ee5396]#[bold]PREFIX,#[fg=#6f6f6f]NORMAL} "

# Right: Active Folder Path + Session Name
set -g status-right-length 50
set -g status-right "#[fg=#08bdba,bold]#{b:pane_current_path} #[fg=#262626]│ #[fg=#78a9ff,bold]#S "

# --------------------------------------------------------------------
# Window Tabs Styling (Centered)
# --------------------------------------------------------------------
set -g window-status-separator ""

# Inactive windows (Muted Carbonfox Gray)
setw -g window-status-style "fg=#6f6f6f,bg=#161616"
setw -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],} "

# Active window (Carbonfox Blue Accent with dark background block)
setw -g window-status-current-style "fg=#78a9ff,bg=#262626,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, #[fg=#ee5396][Z],} "

# Activity alert styling (Urgent Carbonfox Pink)
setw -g window-status-activity-style "fg=#ee5396,bg=#161616"

# UI Borders and Overlays
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#78a9ff"
set -g message-style "fg=#78a9ff,bg=#262626,bold"
set -g mode-style "fg=#78a9ff,bg=#262626,bold"

# ====================================================================
# PLUGINS (TPM)
# ====================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-environment'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin options
set -g @continuum-restore 'on'
set -g @sessionx-bind 'o'

run '~/.config/tmux/plugins/tpm/tpm'
