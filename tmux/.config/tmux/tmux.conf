# === SYSTEM & ENVIRONMENT ===
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "foot"
set -ag terminal-overrides ",foot:Tc,image"

# Yazi Passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Core Options
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === GLOBAL SHORTCUTS (LEADERLESS) ===
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Smart-Splits Nav
bind-key -n 'C-h' if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Smart-Splits Resize
bind-key -n C-M-h if -F "#{@pane-is-vim}" 'send-keys C-M-h' 'resize-pane -L 5'
bind-key -n C-M-j if -F "#{@pane-is-vim}" 'send-keys C-M-j' 'resize-pane -D 5'
bind-key -n C-M-k if -F "#{@pane-is-vim}" 'send-keys C-M-k' 'resize-pane -U 5'
bind-key -n C-M-l if -F "#{@pane-is-vim}" 'send-keys C-M-l' 'resize-pane -R 5'

# Tab Cycling (Alt + Shift + H/L)
bind -n M-H previous-window
bind -n M-L next-window

# Tab Jumps (Alt + 1-9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# === PREFIX SHORTCUTS (CTRL+SPACE) ===
unbind l
bind l send-keys 'C-l'
bind v copy-mode

# Window/Pane Lifecycle
bind x kill-pane
bind X kill-window
bind C new-window -c "#{pane_current_path}"

# Directional Swaps
bind H swap-pane -d -t '{left-of}'
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L swap-pane -d -t '{right-of}'

# Standard Splits
bind ';' split-window -v
bind "'" split-window -h

# Path-Preserving Splits
bind Enter split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# === COPY MODE (VI STYLE) ===
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

# === THEME & STYLING ===
set -g status-justify left
set -g status-style "fg=#7b8496"
set -g status-left ""
set -g window-status-separator ""

# Dashboard & Prefix Alert
set -g status-right "#{?client_prefix,#[fg=#ee5396]#[bold]  [PREFIX] ,}#[fg=#7b8496]#[fg=#78a9ff]#[bold]#S"
set -g status-right-length 50

# Tabs
setw -g window-status-current-style "fg=#78a9ff,bold"
setw -g window-status-current-format " #I:#W* "
setw -g window-status-style "fg=#7b8496"
setw -g window-status-format " #I:#W "

# Borders
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#78a9ff"

# === PLUGINS (TPM) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-environment'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin Opts
set -g @continuum-restore 'on'
set -g @sessionx-bind 'o'

run '~/.config/tmux/plugins/tpm/tpm'
