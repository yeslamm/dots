# ==============================================================================
# FONTS
# ==============================================================================
font_family      JetBrainsMono NF Regular
bold_font        JetBrainsMono NF Bold
bold_italic_font JetBrainsMono NF Bold Italic
font_size        16.0
disable_ligatures never

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor_shape block
cursor_blink_interval 0.8
shell_integration no-cursor
cursor_trail 10
cursor_trail_start_threshold 0 
cursor_trail_decay 0.01 0.05

mouse_hide_wait -1
copy_on_select yes
# paste_on_middle_mouse_button yes
detect_urls yes
open_url_with default

# ==============================================================================
# SCROLLBACK
# ==============================================================================
scrollback_lines 10000
wheel_scroll_multiplier 15.0
touch_scroll_multiplier 15.0

# ==============================================================================
# WINDOW & LAYOUT
# ==============================================================================
remember_window_size  no
initial_window_width  1200
initial_window_height 800
window_padding_width 0 3 0 3
confirm_os_window_close 1

# Enables native split-pane behavior similar to tmux
enabled_layouts splits, tall, fat, grid

# ==============================================================================
# TAB BAR
# ==============================================================================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align center 
active_tab_font_style   bold-italic
inactive_tab_font_style bold-italic

# ==============================================================================
# PERFORMANCE & SYSTEM
# ==============================================================================
sync_to_monitor no
enable_audio_bell no

# ==============================================================================
# KEYBINDINGS
# ==============================================================================

# --- Window / Split Creation ---
# Standard Style: Open in CURRENT directory (Most used)
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\     launch --location=vsplit --cwd=current

# Sway Style: Open in HOME directory (Fresh shell)
map ctrl+shift+; launch --location=hsplit
map ctrl+shift+' launch --location=vsplit

# --- Window Navigation (Vim Style - Community Standard) ---
# Moves focus between your splits without leaving the home row
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# --- Tab Management ---
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
# Swapped to brackets since h & l are now used for window navigation
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

# --- Scrolling & Search ---
map ctrl+shift+f show_scrollback
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# --- Misc ---
map ctrl+backspace send_text all \x17
map ctrl+shift+f5 load_config_file
map ctrl+shift+space next_layout

# ==============================================================================
# THEME
# ==============================================================================
# background_opacity 0.6

# BEGIN_KITTY_THEME
# Vague
include current-theme.conf
# END_KITTY_THEME
