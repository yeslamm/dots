[indicator]
padding = { open = "█", close = "" }

[mgr]
marker_copied = { fg = "#25be6a", bg = "#25be6a" }
marker_cut = { fg = "#ee5396", bg = "#ee5396" }
marker_marked = { fg = "#be95ff", bg = "#be95ff" }
marker_selected = { fg = "#78a9ff", bg = "#78a9ff" }

cwd = { fg = "#08bdba", bold = true }
hovered = { fg = "#78a9ff", bg = "#262626", bold = true }
preview_hovered = { reversed = true }

find_keyword = { fg = "#ee5396", bg = "#262626", bold = true }
find_position = { fg = "#6f6f6f" }

count_copied = { fg = "#161616", bg = "#25be6a" }
count_cut = { fg = "#161616", bg = "#ee5396" }
count_selected = { fg = "#161616", bg = "#78a9ff" }

border_symbol = "│"
border_style = { fg = "#363636" }

[mode]
normal_main = { fg = "#161616", bg = "#78a9ff", bold = true }
normal_alt = { fg = "#78a9ff", bg = "#2a2a2a" }
select_main = { fg = "#161616", bg = "#be95ff", bold = true }
select_alt = { fg = "#be95ff", bg = "#2a2a2a" }
unset_main = { fg = "#161616", bg = "#08bdba", bold = true }
unset_alt = { fg = "#08bdba", bg = "#2a2a2a" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#dfdfe0", bg = "#161616" }

progress_label = { fg = "#161616", bg = "#78a9ff", bold = true }
progress_normal = { fg = "#161616", bg = "#78a9ff" }
progress_error = { fg = "#161616", bg = "#ee5396" }

perm_type = { fg = "#78a9ff" }
perm_read = { fg = "#be95ff" }
perm_write = { fg = "#ee5396" }
perm_exec = { fg = "#25be6a" }
perm_sep = { fg = "#6f6f6f" }

[tabs]
active = { fg = "#78a9ff", bg = "#262626", bold = true }
inactive = { fg = "#6f6f6f", bg = "#161616" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[pick]
border = { fg = "#363636" }
active = { fg = "#78a9ff", bold = true }
inactive = { fg = "#6f6f6f" }

[input]
border = { fg = "#363636" }
title = { fg = "#78a9ff", bold = true }
value = { fg = "#dfdfe0" }
selected = { fg = "#161616", bg = "#78a9ff" }

[completion]
border = { fg = "#363636" }
active = { fg = "#161616", bg = "#78a9ff", bold = true }
inactive = { fg = "#6f6f6f" }

[tasks]
border = { fg = "#363636" }
title = { fg = "#be95ff", bold = true }
hovered = { fg = "#78a9ff", bold = true }

[which]
cols = 2
separator = "  "
separator_style = { fg = "#6f6f6f" }
mask = { bg = "#161616" }
rest = { fg = "#dfdfe0" }
cand = { fg = "#78a9ff" }
desc = { fg = "#6f6f6f" }

[help]
on = { fg = "#be95ff" }
run = { fg = "#78a9ff" }
desc = { fg = "#dfdfe0" }
hovered = { fg = "#161616", bg = "#78a9ff", bold = true }
footer = { fg = "#161616", bg = "#dfdfe0" }

[notify]
title_info = { fg = "#25be6a" }
title_warn = { fg = "#08bdba" }
title_error = { fg = "#ee5396" }

[filetype]
rules = [
  { mime = "image/*", fg = "#08bdba" },
  { mime = "{audio,video}/*", fg = "#be95ff" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ee5396" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#25be6a" },
  { url = "*", is = "orphan", fg = "#ee5396", bold = true },
  { url = "*", is = "exec", fg = "#25be6a" },
  { url = "*/", fg = "#78a9ff" },
  { url = "*", fg = "#dfdfe0" },
]
