set -g default-terminal "tmux-256color"
set -as terminal-features "foot*:RGB:sixel:usstyle:extkeys"
set -g allow-passthrough on
set -s set-clipboard on

set -s escape-time 0
set -s extended-keys on
set -g history-limit 50000
set -g focus-events on
set -g status-keys emacs
set -g detach-on-destroy off

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S#{?#{!=:#W,},: #W,}"

set -g allow-rename off
set -g automatic-rename off
set-hook -g window-linked 'if -F "#{m:*zsh,#W}" "rename-window \"\""'

unbind C-b
set -g prefix C-Space
bind C-b source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind l send-keys 'C-l'

bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

set -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

bind ';' split-window -v -c "#{pane_current_path}"
bind "'" split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
bind x   kill-pane
bind X   confirm-before kill-window

bind -n C-h select-pane -L
bind -n C-j if -F "#{m:*fzf*,#{pane_current_command}}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{m:*fzf*,#{pane_current_command}}" 'send-keys C-k' 'select-pane -U'
bind -n C-l select-pane -R

%hidden is_vim="#{||:#{@pane-is-vim},#{m:*fzf*,#{pane_current_command}}}"

bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -n C-M-h if -F "#{@pane-is-vim}" 'send-keys C-M-h' 'resize-pane -L 1'
bind -n C-M-j if -F "#{@pane-is-vim}" 'send-keys C-M-j' 'resize-pane -D 1'
bind -n C-M-k if -F "#{@pane-is-vim}" 'send-keys C-M-k' 'resize-pane -U 1'
bind -n C-M-l if -F "#{@pane-is-vim}" 'send-keys C-M-l' 'resize-pane -R 1'

bind H swap-window -t -1 \; previous-window
bind L swap-window -t +1 \; next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-S-! move-pane -t :1
bind -n M-S-@ move-pane -t :2
bind -n M-S-# move-pane -t :3
bind -n M-S-$ move-pane -t :4
bind -n M-S-% move-pane -t :5
bind -n M-S-^ move-pane -t :6
bind -n M-S-& move-pane -t :7
bind -n M-S-* move-pane -t :8
bind -n M-S-( move-pane -t :9

bind s run-shell '
  sel="$(sesh list | fzf-tmux -p 80%,80% \
    --no-sort --border-label " sesh " \
    --header "  ^a all ^t tmux ^g configs ^x zoxide ^d kill" \
    --bind "tab:down,btab:up" \
    --bind "ctrl-a:reload(sesh list)" \
    --bind "ctrl-t:reload(sesh list -t)" \
    --bind "ctrl-g:reload(sesh list -c)" \
    --bind "ctrl-x:reload(sesh list -z)" \
    --bind "ctrl-d:execute(tmux kill-session -t {})+reload(sesh list)" \
    --preview-window "right:55%" \
    --preview "sesh preview {}")"
  if [ -n "$sel" ]; then
    sesh connect "$sel"
  fi
'

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#161616,fg=#f2f4f8"

set -g status-left-length 30
set -g status-left " #[fg=#78a9ff,bold]#S "
set -g status-right " #{?client_prefix,#[fg=#ee5396]#[bold]PREFIX  ,}#[fg=#be95ff,bold]%H:%M "

set -g window-status-separator ""
set -g window-status-style "fg=#6f6f6f"
set -g window-status-format " #I#{?#{!=:#W,},:#W,}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "fg=#78a9ff,bold"
set -g window-status-current-format " #I#{?#{!=:#W,},:#W,}#{?window_zoomed_flag, #[fg=#ee5396][Z],} "
set -g window-status-activity-style "fg=#ee5396"

set -g message-style "fg=#ffffff,bg=#262626,fill=#262626"
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#78a9ff"
set -g mode-style "fg=#78a9ff,bg=#262626,bold"
set -g popup-style "bg=#161616,fg=#dfdfe0"
set -g popup-border-style "fg=#363636"
