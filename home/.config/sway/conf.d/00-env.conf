seat * xcursor_theme capitaine-cursors-light 32

exec dbus-update-activation-environment --systemd DISPLAY \
                                                  SWAYSOCK \
                                                  WAYLAND_DISPLAY \
                                                  XDG_CURRENT_DESKTOP \
                                                  XCURSOR_THEME \
                                                  XCURSOR_SIZE

exec gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec gsettings set org.gnome.desktop.interface font-name 'Adwaita Sans 11'
exec gsettings set org.gnome.desktop.interface cursor-theme 'capitaine-cursors-light'
exec gsettings set org.gnome.desktop.interface cursor-size 32
