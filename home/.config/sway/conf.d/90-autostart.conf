exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec keyd-application-mapper
exec mako

exec foot --server
exec_always pkill -SIGUSR2 -x waybar || (sleep 0.5 && waybar)

exec bluelight on
exec swayidle -w
exec wayland-pipewire-idle-inhibit -d 10 -q

exec wl-paste --type text  --watch cliphist -db-path "$XDG_RUNTIME_DIR/cliphist.db" store
exec wl-paste --type image --watch cliphist -db-path "$XDG_RUNTIME_DIR/cliphist.db" store
exec playerctld daemon
exec aria2c --conf-path="$HOME/.config/aria2/aria2-rpc.conf"
