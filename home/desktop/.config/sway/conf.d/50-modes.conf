bindsym --to-code $mod+e mode "EXEC"
mode "EXEC" {
    bindsym --to-code l exec swaylock -f; mode "default"
    bindsym --to-code s exec sh -c 'pgrep -x swaylock >/dev/null || swaylock -f; systemctl suspend'; mode "default"
    bindsym --to-code e exec powermenu exit; mode "default"
    bindsym --to-code r exec powermenu reboot; mode "default"
    bindsym --to-code p exec powermenu poweroff; mode "default"

    bindsym --to-code n exec bluelight toggle; mode "default"
    bindsym --to-code t exec tearing -n; mode "default"

    bindsym --to-code w exec pkill -SIGUSR1 -x waybar; mode "default"

    bindsym --to-code 1 exec powerprofilesctl set power-saver && $msg_asus "Profile: Power Saver"; mode "default"
    bindsym --to-code 2 exec powerprofilesctl set balanced && $msg_asus "Profile: Balanced"; mode "default"
    bindsym --to-code 3 exec powerprofilesctl set performance && $msg_asus "Profile: Performance"; mode "default"
    bindsym --to-code 4 exec asusctl battery limit 60 && $msg_asus "Battery: Limit set to 60%"; mode "default"
    bindsym --to-code 5 exec asusctl battery oneshot && $msg_asus "Battery: Charging to 100%"; mode "default"

    bindsym Escape mode "default"
    bindsym Return mode "default"
    bindsym --to-code q mode "default"
    bindsym --to-code $mod+e mode "default"
}
