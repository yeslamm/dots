output * bg #0f0f0f solid_color
output eDP-1 max_render_time 3

input type:keyboard {
    xkb_layout "us,ara"
    xkb_options grp:win_space_toggle
    repeat_delay 190
    repeat_rate 60
}

input type:touchpad {
    pointer_accel 0.4
    scroll_factor 0.8
    tap enabled
}

input type:pointer {
    accel_profile flat
    pointer_accel 0.4
}

bindgesture swipe:3:right workspace next
bindgesture swipe:3:left  workspace prev

bindswitch --locked lid:on exec sh -c 'pgrep -x swaylock >/dev/null || swaylock -f'
