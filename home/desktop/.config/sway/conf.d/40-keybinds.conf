floating_modifier $mod normal

bindsym $mod+Return exec $term
bindsym $mod+Shift+Return exec $float_term
bindsym --to-code $mod+d exec $menu

bindsym --to-code $mod+y exec $term yazi
bindsym --to-code $mod+Shift+y exec $float_term yazi
bindsym --to-code $mod+b exec $term btop
bindsym --to-code $mod+Shift+b exec $float_term btop

bindsym --to-code $mod+q kill
bindsym --to-code $mod+Shift+r reload

bindsym --to-code $mod+h focus left
bindsym --to-code $mod+j focus down
bindsym --to-code $mod+k focus up
bindsym --to-code $mod+l focus right

bindsym --to-code $mod+Shift+h move left  40 px
bindsym --to-code $mod+Shift+j move down  40 px
bindsym --to-code $mod+Shift+k move up    40 px
bindsym --to-code $mod+Shift+l move right 40 px

bindsym --to-code Control+$mod+h resize shrink width  40 px
bindsym --to-code Control+$mod+j resize grow   height 40 px
bindsym --to-code Control+$mod+k resize shrink height 40 px
bindsym --to-code Control+$mod+l resize grow   width  40 px

bindsym --to-code Control+Shift+$mod+h resize shrink width  5 px
bindsym --to-code Control+Shift+$mod+j resize grow   height 5 px
bindsym --to-code Control+Shift+$mod+k resize shrink height 5 px
bindsym --to-code Control+Shift+$mod+l resize grow   width  5 px

bindsym --to-code $mod+w layout tabbed
bindsym --to-code $mod+Shift+w layout toggle split
bindsym --to-code $mod+Control+w layout stacking
bindsym --to-code $mod+apostrophe split h
bindsym --to-code $mod+semicolon split v
bindsym --to-code $mod+Shift+apostrophe split none
bindsym --to-code $mod+Shift+semicolon split none

bindsym --to-code $mod+f fullscreen
bindsym --to-code $mod+Shift+f floating toggle
bindsym --to-code $mod+Shift+c move position center
bindsym --to-code $mod+a focus parent
bindsym --to-code $mod+c focus child

bindsym --to-code $mod+grave workspace back_and_forth
bindsym $mod+Tab focus next
bindsym $mod+Shift+Tab focus prev
bindsym --to-code $mod+z focus mode_toggle

bindsym --to-code $mod+s scratchpad show
bindsym --to-code $mod+Shift+s move scratchpad
bindsym --to-code $mod+Control+s exec scratch-menu

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

bindsym $mod+Control+1 move container to workspace number 1; workspace number 1
bindsym $mod+Control+2 move container to workspace number 2; workspace number 2
bindsym $mod+Control+3 move container to workspace number 3; workspace number 3
bindsym $mod+Control+4 move container to workspace number 4; workspace number 4
bindsym $mod+Control+5 move container to workspace number 5; workspace number 5
bindsym $mod+Control+6 move container to workspace number 6; workspace number 6
bindsym $mod+Control+7 move container to workspace number 7; workspace number 7
bindsym $mod+Control+8 move container to workspace number 8; workspace number 8
bindsym $mod+Control+9 move container to workspace number 9; workspace number 9

bindsym --locked XF86AudioPlay exec media play-pause
bindsym --locked XF86AudioNext exec media next
bindsym --locked XF86AudioPrev exec media prev

bindsym --to-code --locked $mod+slash exec media play-pause
bindsym --to-code --locked $mod+period exec media next
bindsym --to-code --locked $mod+comma exec media prev

bindsym --to-code --locked $mod+Shift+period exec media seek 5+
bindsym --to-code --locked $mod+Shift+comma exec media seek 5-
bindsym --to-code --locked $mod+Shift+slash exec media seek 0

bindsym --to-code --locked $mod+Control+comma exec media shift
bindsym --to-code --locked $mod+Control+period exec media unshift

bindsym --locked $mod+equal exec osd vol up
bindsym --locked $mod+minus exec osd vol down
bindsym --locked $mod+0 exec osd vol mute
bindsym --locked $mod+Shift+0 exec osd mic toggle

bindsym --locked XF86MonBrightnessUp exec osd brightness up
bindsym --locked XF86MonBrightnessDown exec osd brightness down
bindsym --to-code --locked $mod+bracketright exec osd brightness up
bindsym --to-code --locked $mod+bracketleft exec osd brightness down

bindsym --to-code $mod+n exec makoctl dismiss
bindsym --to-code $mod+Shift+n exec makoctl invoke

bindsym --to-code $mod+i exec pkill -x swayidle && $msg_idle "IDLE: OFF" || (swayidle -w & $msg_idle "IDLE: ON")

bindsym --to-code $mod+v exec swaymsg '[app_id="float_clip"] kill' || $term --app-id=float_clip clipfzf
bindsym --to-code $mod+p exec swaymsg '[app_id="float_pulse"] scratchpad show' || $term --app-id=float_pulse pulsemixer

bindsym --release Print exec grimshot --notify --freeze copy area
bindsym Shift+Print exec grimshot --notify copy output
bindsym Control+Print exec grimshot --notify copy active

bindsym --release $mod+Print exec screenshot region
bindsym $mod+Shift+Print exec screenshot fullscreen
bindsym $mod+Control+Print exec screenshot window

bindsym --release $mod+F12 exec screenrec region
bindsym $mod+Shift+F12 exec screenrec fullscreen
bindsym $mod+Control+F12 exec screenrec window
