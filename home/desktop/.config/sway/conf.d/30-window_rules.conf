for_window [app_id="(?i)FileRoller|gpu_screen_recorder|xdg-desktop-portal-gtk|pavucontrol"] floating enable
for_window [app_id="firefox" title="^Extension:"] floating enable
for_window [title="(?i)picture[- ]in[- ]picture"] floating enable, sticky enable

for_window [app_id="^float_"] floating enable, resize set width 70 ppt height 75 ppt
for_window [app_id="float_clip"] resize set width 85 ppt height 85 ppt
for_window [app_id="float_pulse"] move scratchpad, scratchpad show

for_window [app_id="(?i)satty"] floating enable
for_window [app_id="(?i)satty" title="^Satty"] move scratchpad
no_focus [app_id="(?i)satty" title="^Satty"]

for_window [app_id="swayimg"] fullscreen enable

for_window [all] inhibit_idle fullscreen
for_window [app_id="(?i)zathura|qbittorrent"] inhibit_idle focus
for_window [class="(?i)steam|gamescope|\.exe"] inhibit_idle focus
