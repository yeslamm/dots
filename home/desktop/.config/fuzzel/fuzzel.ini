[main]
font=JetBrainsMono Nerd Font:pixelsize=20
dpi-aware=no
icons-enabled=no
match-counter=yes
show-actions=yes
exit-on-keyboard-focus-loss=no

width=44
lines=12
line-height=22
tabs=6

horizontal-pad=20
vertical-pad=20
inner-pad=10

fields=name,generic,comment,categories,filename,keywords
terminal=foot {cmd}

[colors]
background=161616ff
text=dfdfe0ff
input=ffffffff
placeholder=6f6f6fff
prompt=78a9ffff
counter=6f6f6fff
border=363636ff

match=78a9ffff
selection=262626ff
selection-text=78a9ffff
selection-match=78a9ffff

[border]
width=1
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c

prev=Up Control+p
next=Down Control+n
first=Control+Home Control+h
last=Control+End Control+l
prev-page=Page_Up Control+u
next-page=Page_Down Control+d

delete-line-forward=none
delete-line-backward=none
delete-next=none
delete-prev=BackSpace
