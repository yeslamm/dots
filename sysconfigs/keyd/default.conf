[ids]
# Applies to all connected keyboards
*

[main]
# Pure Escape for Sway compatibility
capslock = escape
escape = capslock

# Intercept the Copilot hardware macro and turn it into a Super/Meta key
leftmeta+leftshift+f23 = leftmeta

# Trigger the Vim layer by holding Right Alt
rightalt = layer(nav)

[nav]
# ---------------------------------------------------------
# VIM NAVIGATION LAYER (Hold Right Alt)
# ---------------------------------------------------------

# Core Movement
h = left
j = down
k = up
l = right

# Word Movement (w = forward, b = back)
w = C-right
b = C-left

# Line Begin/End (0 = ^, 4 = $)
0 = home
4 = end

# Page Movement (Vim Ctrl+u / Ctrl+d)
u = pageup
d = pagedown
