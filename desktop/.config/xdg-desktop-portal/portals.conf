[preferred]
# 1. The Fallback
# Use GTK for standard desktop dialogs (File Pickers, App Choosers, Printing)
default=gtk

# 2. The Specialist Overrides
# Force all screen sharing and screenshot requests to the wlroots backend
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
