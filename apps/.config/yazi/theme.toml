# A OneDark theme for Yazi
# Blue Folders + Green Status Bar + Boxxy Layout + White Selection

"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

# : Flavor {{{
[flavor]
dark = ""
light = ""
# : }}}

# : App {{{
[app]
overall = {}
# : }}}

# : Manager {{{
[mgr]
cwd = { fg = "#61afef" } # Blue

# Find
find_keyword = { fg = "#be5046", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#c678dd", italic = true }

# Marker
marker_copied = { fg = "#98c379", bg = "#98c379" }
marker_cut = { fg = "#e06c75", bg = "#e06c75" }
marker_marked = { fg = "#56b6c2", bg = "#56b6c2" }
marker_selected = { fg = "#8fb572", bg = "#8fb572" } # Green

# Count
count_copied = { fg = "#282c34", bg = "#98c379" }
count_cut = { fg = "#282c34", bg = "#e06c75" }
count_selected = { fg = "#282c34", bg = "#8fb572" } # Green

# Border
border_symbol = "│"
border_style = { fg = "#5c6370" }

# Highlighting
syntect_theme = ""
# : }}}

# : Tabs {{{
[tabs]
# Active: Black on Green (Matches Status Bar)
active = { fg = "#282c34", bg = "#8fb572", bold = true }
inactive = { fg = "#abb2bf", bg = "#3e4452" }

# Boxxy Separators
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }
# : }}}

# : Mode {{{
[mode]
# Normal Mode: Green (The "Bar Below")
normal_main = { fg = "#282c34", bg = "#8fb572", bold = true }
normal_alt = { fg = "#8fb572", bg = "#3e4452" }

# Select Mode: Purple
select_main = { fg = "#282c34", bg = "#c678dd", bold = true }
select_alt = { fg = "#c678dd", bg = "#3e4452" }

# Unset Mode: Red
unset_main = { fg = "#282c34", bg = "#e06c75", bold = true }
unset_alt = { fg = "#e06c75", bg = "#3e4452" }
# : }}}

# : Indicator of hovered file {{{
[indicator]
# Selection Bar: Bright White Background with Dark Text
current = { bg = "#cccccc", fg = "#000000", bold = true }
parent = { bg = "#cccccc", fg = "#000000", bold = true }

# Boxxy Style: Solid vertical bar
padding = { open = "█", close = "" }
# : }}}

# : Status bar {{{
[status]
overall = {}
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#5c6370" }
perm_type = { fg = "#8fb572" }  # Green
perm_read = { fg = "#98c379" }
perm_write = { fg = "#e06c75" }
perm_exec = { fg = "#61afef" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#282c34", bg = "#8fb572" } # Black on Green
progress_error = { fg = "#282c34", bg = "#e06c75" }
# : }}}

# : Which {{{
[which]
cols = 3
mask = { bg = "#282c34" }
cand = { fg = "#61afef" }
rest = { fg = "#5c6370" }
desc = { fg = "#c678dd" }
separator = "  "
separator_style = { fg = "#5c6370" }
# : }}}

# : Confirmation {{{
[confirm]
border = { fg = "#8fb572" }
title = { fg = "#8fb572" }
body = {}
list = {}
btn_yes = { reversed = true }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]
# : }}}

# : Spotter {{{
[spot]
border = { fg = "#8fb572" }
title = { fg = "#8fb572" }
tbl_col = { fg = "#8fb572" }
tbl_cell = { fg = "#282c34", bg = "#8fb572" }
# : }}}

# : Notification {{{
[notify]
title_info = { fg = "#98c379" }
title_warn = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

icon_info = ""
icon_warn = ""
icon_error = ""
# : }}}

# : Picker {{{
[pick]
border = { fg = "#8fb572" }
active = { fg = "#c678dd", bold = true }
inactive = {}
# : }}}

# : Input {{{
[input]
border = { fg = "#8fb572" }
title = {}
value = {}
selected = { reversed = true }
# : }}}

# : Completion {{{
[cmp]
border = { fg = "#8fb572" }
active = { fg = "#282c34", bg = "#8fb572" }
inactive = {}

icon_file = ""
icon_folder = ""
icon_command = ""
# : }}}

# : Task manager {{{
[tasks]
border = { fg = "#8fb572" }
title = {}
hovered = { fg = "#c678dd", bold = true }
# : }}}

# : Help menu {{{
[help]
on = { fg = "#8fb572" }
run = { fg = "#c678dd" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#282c34", bg = "#abb2bf" }
# : }}}

# : File-specific styles {{{
[filetype]
rules = [
  # Directories -> Blue
  { mime = "inode/directory", fg = "#61afef" },

  # Image
  { mime = "image/*", fg = "#e5c07b" },
  # Media
  { mime = "{audio,video}/*", fg = "#c678dd" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e06c75" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "#56b6c2" },
  # Fallback
  { url = "*/", fg = "#abb2bf" },
]
# : }}}

